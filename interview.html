<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interview Shelly — AI Pre-Interview Assistant</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --ink: oklch(0.24 0.17 264);
    --ink-soft: #4D4C6D;
    --bg: #FDFBF6;
    --card: #F5F4F2;
    --border: #E4E1D8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: 'Lato', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }

  .close-btn {
    position: fixed; top: 40px; right: 40px; z-index: 10;
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--ink); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; color: var(--ink);
  }
  .close-btn svg { width: 16px; height: 16px; }

  .close-btn, .intro, form#chat-form {
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .intro { transition-delay: 0.08s; }
  form#chat-form { transition-delay: 0.16s; }
  body:not(.page-ready) .close-btn,
  body:not(.page-ready) .intro,
  body:not(.page-ready) form#chat-form {
    opacity: 0;
    transform: translateY(24px);
  }

  main {
    max-width: 760px; margin: 0 auto; position: relative;
    padding: clamp(20px, 4vw, 40px) clamp(16px, 5vw, 24px) 140px;
    display: flex; flex-direction: column; gap: 0;
  }

  .intro { text-align: center; padding: 20px 10px 0; }
  .intro-figure { display: flex; justify-content: center; margin-bottom: 4px; }
  .intro-figure svg { width: 86px; height: 77px; display: block; }
  .intro h1 { font-size: clamp(24px, 5vw, 40px); margin: 0 0 6px; }
  .intro .hint { display: block; font-size: 14px; font-weight: 400; color: var(--ink-soft); margin: 8px 0 38px; }
  .intro p { color: var(--ink-soft); font-size: 15px; margin: 0; line-height: 1.5; }

  .chips {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    max-width: 560px; width: 100%; margin: 0 auto 38px;
  }
  .chip {
    border: 1.5px solid transparent; background: #F0EEE9; color: var(--ink);
    border-radius: 20px; padding: 9px 16px; font-size: 13.5px; cursor: pointer;
    font-family: inherit; transition: background 0.2s ease, border-color 0.2s ease;
    white-space: nowrap; flex: none;
  }
  .chip:hover { background: var(--card); border-color: var(--ink); }

  #chat-log { display: flex; flex-direction: column; gap: 14px; }

  .msg { display: flex; }
  .msg-user { justify-content: flex-end; }
  .msg-assistant { justify-content: flex-start; }

  .bubble {
    max-width: 78%; padding: 13px 17px; border-radius: 16px;
    font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg-user .bubble { background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .msg-assistant .bubble { background: var(--card); color: var(--ink); border-bottom-left-radius: 4px; }
  .bubble.error { background: #FBEAEA; color: #8A2E2E; }

  .bubble.typing::after {
    content: "●●●"; display: inline-block; letter-spacing: 2px;
    animation: pulse 1.2s infinite ease-in-out; color: var(--ink-soft); font-size: 12px;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  form#chat-form {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    padding: 24px clamp(16px, 5vw, 24px) 22px;
  }
  .input-row {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 8px 8px 8px 18px;
  }
  #chat-input {
    flex: 1; border: none; outline: none; resize: none; font-family: inherit;
    font-size: 15px; line-height: 1.5; max-height: 120px; padding: 8px 0; color: var(--ink);
    background: transparent;
  }
  #chat-input::placeholder { color: #A8A6B8; }
  #send-btn {
    flex: none; width: 42px; height: 42px; border-radius: 4px; border: none;
    background: var(--ink); color: #fff; cursor: pointer; font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s ease;
  }
  #send-btn:disabled { opacity: 0.4; cursor: default; }

  .disclaimer { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 10px; }

  body.chat-started main { padding-top: 78px; }

  @media (max-width: 640px) {
    .bubble { max-width: 88%; font-size: 14.5px; }
    .close-btn { top: 18px; right: 18px; }
  }

  @media (min-width: 641px) {
    body:not(.chat-started) main {
      min-height: 100vh;
      justify-content: center;
      padding-bottom: clamp(20px, 4vw, 40px);
    }
    body:not(.chat-started) form#chat-form {
      position: static;
      background: none;
      padding: 0;
    }
    body.chat-started main { padding-top: 104px; }
    body.chat-started .intro { position: absolute; top: 0; left: 0; right: 0; z-index: 2; }

    #mini-brand {
      position: fixed; top: 40px; left: 40px; height: 44px; z-index: 10;
      display: flex; align-items: center; gap: 10px;
      opacity: 0; transform: translateY(-10px); pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #mini-brand svg { width: 36px; height: 32px; display: block; }
    #mini-brand .mini-title { font-weight: 700; font-size: 16px; color: var(--ink); white-space: nowrap; }
    body.brand-ready #mini-brand { opacity: 1; transform: translateY(0); pointer-events: auto; }
  }

  @media (max-width: 640px) {
    #mini-brand { display: none !important; }
  }
</style>
</head>

    </div>
    <div class="intro-text" id="intro-text">
      <h1>Interview Me</h1>
      <p>Feel free to ask anything — Shelly Bot is right here and ready for the interview.</p>
      <span class="hint">(גם בעברית זה בסדר)</span>
      <div class="chips" id="chips">
        <button type="button" class="chip">How do you use AI tools like Claude?</button>
        <button type="button" class="chip">What's your salary expectation?</button>
        <button type="button" class="chip">When can you start?</button>
        <button type="button" class="chip">What's the biggest challenge in B2B design?</button>
      </div>
    </div>
  </div>

  <div id="chat-log"></div>

  <form id="chat-form">
    <div class="input-row">
      <textarea id="chat-input" rows="1" placeholder="What would you like to ask Shelly?" dir="auto"></textarea>
      <button id="send-btn" type="submit" aria-label="Send"><svg width="12" height="13" viewBox="0 0 12 13" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M5.70833 12.0833V0.75M10.6667 5.70833L5.70833 0.75L0.75 5.70833" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg></button>
    </div>
    <div class="disclaimer">AI-generated answers based on Shelly's real experience — not a substitute for talking to her directly.</div>
  </form>
</main>

<script>
  const messages = [];
  const chatLog = document.getElementById('chat-log');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const chips = document.getElementById('chips');
  const intro = document.querySelector('.intro');

  function collapseIntro() {
    if (document.body.classList.contains('chat-started')) return;

    if (!window.matchMedia('(min-width: 641px)').matches) {
      document.body.classList.add('chat-started');
      return;
    }

    const introStart = intro.getBoundingClientRect();
    const formStart = form.getBoundingClientRect();

    document.body.classList.add('chat-started');

    const introEnd = intro.getBoundingClientRect();
    const formEnd = form.getBoundingClientRect();

    const introDy = introStart.top - introEnd.top;
    const formDy = formStart.top - formEnd.top;
    const exitTranslateY = -(introEnd.top + introEnd.height + 80);

    intro.style.transition = 'none';
    intro.style.transform = `translateY(${introDy}px)`;
    intro.style.opacity = '1';
    form.style.transition = 'none';
    form.style.transform = `translateY(${formDy}px)`;
    intro.getBoundingClientRect();

    requestAnimationFrame(() => {
      intro.style.transition = 'transform 0.95s ease, opacity 0.95s ease';
      intro.style.transform = `translateY(${exitTranslateY}px)`;
      intro.style.opacity = '0';

      form.style.transition = 'transform 0.95s ease';
      form.style.transform = 'translateY(0)';
    });

    setTimeout(() => {
      intro.style.display = 'none';
      document.body.classList.add('brand-ready');
    }, 950);
  }

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoGrow);

  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg msg-' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.dir = 'auto';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    chatLog.appendChild(wrap);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    return bubble;
  }

  async function sendMessage(text) {
    const trimmed = text.trim();
    if (!trimmed || sendBtn.disabled) return;

    if (chips.parentElement) chips.style.display = 'none';
    collapseIntro();

    input.value = '';
    autoGrow();
    sendBtn.disabled = true;

    messages.push({ role: 'user', text: trimmed });
    addMessage('user', trimmed);

    const assistantBubble = addMessage('assistant', '');
    assistantBubble.dir = /[֐-׿]/.test(trimmed) ? 'rtl' : 'ltr';
    assistantBubble.classList.add('typing');

    let revealTimer = null;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
      });

      if (!res.ok || !res.body) {
        let errMsg = 'Something went wrong. Please try again in a moment.';
        try {
          const errJson = await res.json();
          if (res.status === 429) errMsg = errJson.error || 'Too many messages — please slow down a bit.';
        } catch (_) {}
        throw new Error(errMsg);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = '';
      let displayed = '';
      let first = true;
      let streamDone = false;

      const reveal = () => {
        if (displayed.length < full.length) {
          const rest = full.slice(displayed.length);
          const match = rest.match(/^\s*\S+\s*/);
          displayed += match ? match[0] : rest;
          assistantBubble.textContent = displayed;
          window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        } else if (streamDone) {
          clearInterval(revealTimer);
          revealTimer = null;
        }
      };
      const startReveal = () => { if (!revealTimer) revealTimer = setInterval(reveal, 25); };

      while (true) {
        const { done, value } = await reader.read();
        if (done) { streamDone = true; break; }
        if (first) { assistantBubble.classList.remove('typing'); assistantBubble.dir = 'auto'; first = false; }
        full += decoder.decode(value, { stream: true });
        startReveal();
      }

      if (!full) full = "Hmm, I didn't catch that — mind trying again?";
      startReveal();
      messages.push({ role: 'assistant', text: full });
    } catch (err) {
      if (revealTimer) clearInterval(revealTimer);
      assistantBubble.classList.remove('typing');
      assistantBubble.classList.add('error');
      assistantBubble.textContent = err.message || 'Something went wrong. Please try again.';
      messages.pop();
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendMessage(input.value);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input.value);
    }
  });

  chips.querySelectorAll('.chip').forEach((chip) => {
    chip.addEventListener('click', () => sendMessage(chip.textContent));
  });

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.body.classList.add('page-ready');
    });
  });

  (function () {
    var closeBtn = document.getElementById('close-btn');
    var overlay = document.getElementById('close-transition-overlay');
    if (!closeBtn || !overlay) return;
    closeBtn.addEventListener('click', function (e) {
      var href = closeBtn.getAttribute('href');
      if (!href) return;
      e.preventDefault();
      sessionStorage.setItem('closeTransition', '1');
      overlay.style.transition = 'none';
      overlay.style.transform = 'translateX(100%)';
      overlay.style.display = 'block';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          overlay.style.transition = 'transform 0.55s cubic-bezier(.65,0,.35,1)';
          overlay.style.transform = 'translateX(0%)';
        });
      });
      setTimeout(function () { window.location.href = href; }, 560);
    });
  })();
</script>

</body>
</html>
